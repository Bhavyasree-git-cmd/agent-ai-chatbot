<!DOCTYPE html>
<html>
<head>
    <title>Simple AI Agent</title>
</head>
<body>
    <h1>🤖 Simple AI Agent</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Type something..." required>
        <button type="submit">Ask</button>
    </form>
    {% if response %}
    <p><strong>Agent:</strong> {{ response }}</p>
    {% endif %}
</body>
</html>
